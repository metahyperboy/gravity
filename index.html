<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Personal Goal & Work Alignment App - Keep your daily work aligned with your yearly goals">
  <meta name="theme-color" content="#2C3E50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Goal Alignment</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    
    <!-- ========== YEAR GOAL SETUP VIEW ========== -->
    <div id="view-setup" class="view active">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h1>🎯 Your Year, Aligned</h1>
        <p class="text-muted">Define your yearly goals with intention.<br>These will guide every day of your work.</p>
      </div>
      
      <div class="card">
        <h3 class="mb-6 text-center">Your 3 Yearly Goals</h3>
        
        <!-- Goal 1 -->
        <div class="form-group">
          <label class="form-label">Goal 1: What do you want to achieve?</label>
          <input type="text" id="goal-1-title" class="form-input" 
                 placeholder="e.g., Launch my first product" required />
        </div>
        
        <div class="form-group">
          <label class="form-label">Why does this goal matter to you?</label>
          <textarea id="goal-1-why" class="form-textarea" 
                    placeholder="Personal significance and motivation..." required></textarea>
        </div>
        
        <div class="form-group">
          <label class="form-label">What does success look like at year-end?</label>
          <textarea id="goal-1-success" class="form-textarea" 
                    placeholder="Measurable outcome or achievement..." required></textarea>
        </div>
        
        <hr style="border: none; border-top: 1px solid var(--color-border); margin: 2rem 0;">
        
        <!-- Goal 2 -->
        <div class="form-group">
          <label class="form-label">Goal 2: What do you want to achieve?</label>
          <input type="text" id="goal-2-title" class="form-input" 
                 placeholder="e.g., Build deep expertise in AI" required />
        </div>
        
        <div class="form-group">
          <label class="form-label">Why does this goal matter to you?</label>
          <textarea id="goal-2-why" class="form-textarea" 
                    placeholder="Personal significance and motivation..." required></textarea>
        </div>
        
        <div class="form-group">
          <label class="form-label">What does success look like at year-end?</label>
          <textarea id="goal-2-success" class="form-textarea" 
                    placeholder="Measurable outcome or achievement..." required></textarea>
        </div>
        
        <hr style="border: none; border-top: 1px solid var(--color-border); margin: 2rem 0;">
        
        <!-- Goal 3 -->
        <div class="form-group">
          <label class="form-label">Goal 3: What do you want to achieve?</label>
          <input type="text" id="goal-3-title" class="form-input" 
                 placeholder="e.g., Improve physical health and energy" required />
        </div>
        
        <div class="form-group">
          <label class="form-label">Why does this goal matter to you?</label>
          <textarea id="goal-3-why" class="form-textarea" 
                    placeholder="Personal significance and motivation..." required></textarea>
        </div>
        
        <div class="form-group">
          <label class="form-label">What does success look like at year-end?</label>
          <textarea id="goal-3-success" class="form-textarea" 
                    placeholder="Measurable outcome or achievement..." required></textarea>
        </div>
        
        <button type="button" class="btn btn-large mt-6" onclick="submitYearGoals()">
          🔒 Lock My Year Goals
        </button>
      </div>
    </div>
    
    <!-- ========== QUARTER PLANNING VIEW ========== -->
    <div id="view-quarters" class="view">
      <div id="quarters-container">
        <!-- Dynamically rendered by app.js -->
      </div>
    </div>
    
    <!-- ========== TODAY (DAILY TRACKER) VIEW ========== -->
    <div id="view-today" class="view">
      <div id="today-container">
        <!-- Dynamically rendered by app.js -->
      </div>
    </div>
    
    <!-- ========== DASHBOARD VIEW ========== -->
    <div id="view-dashboard" class="view">
      <div id="dashboard-container">
        <!-- Dynamically rendered by app.js -->
      </div>
    </div>
    
    <!-- ========== SETTINGS VIEW ========== -->
    <div id="view-settings" class="view">
      <div id="settings-container">
        <!-- Dynamically rendered by app.js -->
      </div>
    </div>
    
    <!-- ========== BOTTOM NAVIGATION ========== -->
    <nav class="bottom-nav">
      <a class="nav-item" data-view="today" onclick="navigateTo('today')">
        <div class="nav-icon">📝</div>
        <div class="nav-label">Today</div>
      </a>
      
      <a class="nav-item" data-view="dashboard" onclick="navigateTo('dashboard')">
        <div class="nav-icon">📊</div>
        <div class="nav-label">Progress</div>
      </a>
      
      <a class="nav-item" data-view="quarters" onclick="navigateTo('quarters')">
        <div class="nav-icon">🎯</div>
        <div class="nav-label">Quarters</div>
      </a>
      
      <a class="nav-item" data-view="settings" onclick="navigateTo('settings')">
        <div class="nav-icon">⚙️</div>
        <div class="nav-label">Settings</div>
      </a>
    </nav>
    
    <!-- ========== WEEKLY REFLECTION MODAL ========== -->
    <div id="weekly-reflection-modal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2 class="modal-title">📅 Weekly Reflection</h2>
        </div>
        
        <div id="reflection-stats">
          <!-- Stats populated by JS -->
        </div>
        
        <form id="weekly-reflection-form" onsubmit="submitWeeklyReflection(event)">
          <div class="form-group">
            <label class="form-label">What moved your quarter goal forward this week?</label>
            <textarea id="reflection-forward" class="form-textarea" rows="3" 
                      placeholder="Wins, progress, momentum..." required></textarea>
          </div>
          
          <div class="form-group">
            <label class="form-label">What wasted time this week?</label>
            <textarea id="reflection-wasted" class="form-textarea" rows="2" 
                      placeholder="Distractions, low-value tasks..." required></textarea>
          </div>
          
          <div class="form-group">
            <label class="form-label">What should you stop doing next week?</label>
            <textarea id="reflection-stop" class="form-textarea" rows="2" 
                      placeholder="Specific actions to eliminate..." required></textarea>
          </div>
          
          <button type="submit" class="btn btn-large">Complete Reflection</button>
        </form>
      </div>
    </div>
    
  </div>
  
  <!-- Scripts -->
  <script src="validators.js"></script>
  <script src="calculations.js"></script>
  <script src="app.js"></script>
</body>
</html>
